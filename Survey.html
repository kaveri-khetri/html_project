<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css"> 
    </head>
    <style>
        body{
            background-color: #05c46b ;
            font-family: Verdana;
            text-align:center ;

            form{
                 background-color:#fff ;
                 max-width: 500px;
                 margin:50px auto ;
                 padding:30px 20px ;
                 box-shadow: 2px 5px 10px rgba(0, 0, 0 , 0.5);
            }

             .form-control{
                text-align:left;
                margin-bottom: 25px;
             }
              .form-control label{
                display: block;
                margin bottom: 10px;
              }

              .form-control input,
              .form-control select,
              .form-control  textarea {
                border: 1px solid#777;
                border-radius: 2px;
                font-family: inherit
                padding:10px;
                display:block;
                width:95%;

              }

              .form-control input[type="radio"],
              .form-control input[type="checkbox"] {
                display:inline-block ;
                width: auto;
              }

              button{
                background-color:  #05c46b);
                border: 1px solid #777;
                border-radius:2px ;
                font-family:inherit;
                font-size:21px;
                display: block;
                width: 100%;
                margin-top:50px ;
                margin-bottom: 20px;
              }


        }
    </style>
    <body>
        <h1>GeeksforGeeks Survey Form</h1>
         <!-- Create Form -->
          <form id="form">
            <!--details-->
            <div class="form-control">
             <label for="name" id="form-name">Name</label>
             <input type="text" id="name" placeholder="Enter your name"/>
            </div>

            <div class="form-control">
              <label for="email" id="form-email">Email</label>
              <input type="email" id="email" placeholder="Enter your email"/>
            </div>

            <div class="form-control">
              <label for="age" id="form-age">Age</label>
              <input type="text" id="age" placeholder="Enter your age"/>
            </div>

            <div class="form-control">
            <label for="role" id="label-role">Which option best describes you?</label>

            <select name="role" id="role">
                <option value="student">student</option>
                <option value="intern">Intern</option>
                <option value="professional">professional</option>
                <option value="other">other</option>
            </select>
            </div>
               <div class="form-control">
                <label>Would you recommend GeeksforGeeks to a friend?</label>

                <label for="recommend-1">
                    <input type="radio" id="recommend-1" name="recommend">Yes</label>

                    <label for="recommend-2">
                    <input type="radio" id="recommend-2" name="recommend">No</label>

                    <label for="recommend-3">
                    <input type="radio" id="recommend-3" name="recommend">Maybe</label>
               </div>

               <div class="form-control">
                <label>Languages and Frameworks known
                <small>(Check all that apply)</small></label>

                <label for="inp-1">
                <input type="checkbox" name="inp">C
            </label>

            <label for="inp-2">
                <input type="checkbox" name="inp">C++
            </label>

            <label for="inp-3">
                <input type="checkbox" name="inp">C#
            </label>

            <label for="inp-4">
                <input type="checkbox" name="inp">Java
            </label>

            <label for="inp-5">
                <input type="checkbox" name="inp">Python
            </label>

            <label for="inp-6">
                <input type="checkbox" name="inp">Javascript
            </label>

            <label for="inp-7">
                <input type="checkbox" name="inp">React
            </label>

            <label for="inp-8">
                <input type="checkbox" name="inp">Angular
            </label>

            <label for="inp-9">
                <input type="checkbox" name="inp">Django
            </label>

            <label for="inp-10">
                <input type="checkbox" name="inp">Spring
            </label>
               </div>

               <div class="form-control">
                <label for="comment">Any comments or suggestions</label>
                <textarea name="comment" id="comment" placeholder="Enter your comment hear"></textarea>
        
               </div>
           <!--subit button-->
               <button type="submit" value="submit">Submit</button>
 
          </form>
    </body>
</html>
